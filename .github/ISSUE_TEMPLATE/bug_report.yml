name: Bug Report
description: Report a bug or unexpected behavior
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please fill out the sections below so we can reproduce and fix the issue.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of what happened and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Minimal steps to reproduce the behavior.
      placeholder: |
        1. Create postbox.yaml with ...
        2. Run `postbox serve`
        3. Send an email to ...
        4. See error ...
    validations:
      required: true

  - type: textarea
    id: config
    attributes:
      label: Configuration
      description: Your postbox.yaml (redact any sensitive values such as passwords or API keys).
      render: yaml

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant log output from postbox.
      render: text

  - type: input
    id: version
    attributes:
      label: Postbox Version
      description: Output of `postbox version`
      placeholder: "v0.1.0"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Linux (amd64)
        - Linux (arm64)
        - Docker
        - Other
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Anything else that might help (screenshots, related issues, workarounds tried).
